# SonarQube Server: set SONAR_HOST_URL to your server.  SonarQube Cloud: https://sonarcloud.io + sonar.organization.
sonar.projectKey=option-marking-desk
sonar.projectName=Option Marking Desk
# sonar.organization=yugpokiya          # SonarQube Cloud only

sonar.sources=app,web/src,deploy
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/migrations/**,alembic/**,**/__pycache__/**,deploy/**/*.md,web/src/**/*.test.ts
sonar.coverage.exclusions=deploy/**,web/src/**,app/quant/demo.py

# reports produced by the unit + integration jobs
sonar.python.coverage.reportPaths=coverage-unit.xml,coverage-integration.xml
sonar.python.xunit.reportPath=junit-*.xml

# IaC: also analyse Dockerfiles and K8s manifests for security issues
sonar.docker.file.patterns=deploy/docker/*.Dockerfile
sonar.kubernetes.file.suffixes=.yaml

# Local full stack: http://localhost:8080  (API docs: http://localhost:8080/api/docs)
#   docker compose up --build
name: omd-dev

services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: omd, POSTGRES_PASSWORD: omd, POSTGRES_DB: omd}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omd -d omd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: {context: ., dockerfile: deploy/docker/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+asyncpg://omd:omd@db:5432/omd
      REDIS_URL: redis://redis:6379/0
      API_ROOT_PATH: /api
      UVICORN_WORKERS: "1"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: {context: ., dockerfile: deploy/docker/web.Dockerfile}
    ports: ["8080:8080"]
    volumes:
      - ./deploy/codedeploy/nginx-ec2.conf:/etc/nginx/conf.d/default.conf:ro   # same /api proxy as EC2
    depends_on: [api]

volumes:
  pgdata:

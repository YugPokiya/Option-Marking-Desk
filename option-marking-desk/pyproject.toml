[project]
name = "option-marking-desk"
version = "0.1.0"
description = "Marks illiquid options from a fitted, arbitrage-checked volatility smile."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yug Pokiya" }]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends()/File() in defaults is the idiom
  "RUF001", "RUF002", "RUF003",  # unicode in docs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.coverage.run]
source = ["app"]
omit = ["app/quant/demo.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

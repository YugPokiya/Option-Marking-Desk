# Runs on each t3.micro (1 GiB RAM + 1 GiB swap). Values in ${...} come from /opt/omd/.env.
name: omd

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    tag: "{{.Name}}/{{.ID}}"

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    image: ${ECR_REGISTRY}/omd-api:${IMAGE_TAG}
    env_file: [/opt/omd/.env]
    expose: ["8000"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  web:
    <<: *hardening
    image: ${ECR_REGISTRY}/omd-web:${IMAGE_TAG}
    ports: ["80:8080"]                  # ALB -> instance:80 -> nginx:8080
    volumes:
      - ./nginx-ec2.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging

  # Daily IV forecast job (run by the omd-forecast systemd timer, not kept running).
  # Host networking so the job can use the instance role via IMDS (hop limit 1): the long-running
  # api/web containers on the bridge network deliberately cannot.
  forecast:
    <<: *hardening
    restart: "no"
    profiles: [jobs]
    image: ${ECR_REGISTRY}/omd-api:${IMAGE_TAG}
    command: ["python", "-m", "app.forecast", "run-daily"]
    env_file: [/opt/omd/.env]
    network_mode: host
    mem_limit: 700m
    logging: *logging


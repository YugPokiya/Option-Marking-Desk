# On EC2 there is no Istio: nginx does the same job (/api -> API with the prefix stripped).
server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 5m;
  server_tokens off;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location = /api/metrics { return 404; }          # metrics stay internal
  location = /api { return 301 /api/; }
  location /api/ {
    proxy_pass http://api:8000/;                    # trailing slash strips /api
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;                         # same budget as the Istio route
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

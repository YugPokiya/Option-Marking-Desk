apiVersion: v1
kind: ConfigMap
metadata:
  name: omd-config
data:
  APP_ENV: "dev"
  LOG_LEVEL: "info"
  API_ROOT_PATH: "/api"          # only for generated URLs (docs/OpenAPI); Istio strips /api before the request arrives
  REDIS_URL: "redis://redis:6379/0"
  UVICORN_WORKERS: "2"
  FORECAST_SYMBOLS: "NIFTY,BANKNIFTY"
  BEDROCK_REGION: "ap-south-1"
  BEDROCK_MODEL_ID: "in.anthropic.claude-sonnet-5"

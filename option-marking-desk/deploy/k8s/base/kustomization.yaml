apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omd
labels:
  - pairs: {app.kubernetes.io/part-of: option-marking-desk}
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - forecast-cronjob.yaml
  - istio/gateway.yaml
  - istio/virtualservice.yaml
  - istio/destinationrules.yaml
  - istio/peerauthentication.yaml
  - istio/authorizationpolicies.yaml
  - istio/sidecar.yaml
  - istio/egress-forecast.yaml
# The omd-secrets Secret is generated in each overlay from a git-ignored secrets.env.

# One identity per workload. Istio mTLS certificates are issued per service account,
# and the AuthorizationPolicies in istio/ match on these identities.
apiVersion: v1
kind: ServiceAccount
metadata: {name: omd-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: omd-web}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: omd-migrate}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: omd-forecast}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis}
automountServiceAccountToken: false

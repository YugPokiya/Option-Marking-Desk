# TLS for the ingress gateway via Let's Encrypt, DNS-01 on DigitalOcean DNS.
# DNS-01 avoids fighting the Gateway's HTTP->HTTPS redirect during HTTP-01 challenges.
# Prereq: kubectl -n cert-manager create secret generic do-dns-token --from-literal=access-token=<DO API token>
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com        # Let's Encrypt expiry notices
    privateKeySecretRef: {name: letsencrypt-prod-account}
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef: {name: do-dns-token, key: access-token}
---
# Must live in istio-system: the gateway reads credentialName from its own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omd-tls
  namespace: istio-system
spec:
  secretName: omd-tls
  issuerRef: {kind: ClusterIssuer, name: letsencrypt-prod}
  dnsNames:
    - omd.example.com
    - dev.omd.example.com

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: registry.digitalocean.com/omd/omd-api, newTag: dev}
  - {name: registry.digitalocean.com/omd/omd-web, newTag: dev}
generatorOptions:
  disableNameSuffixHash: true      # stable name so the migrate Job can reference it
secretGenerator:
  - name: omd-secrets
    envs: [secrets.env]            # cp secrets.env.example secrets.env (git-ignored)
configMapGenerator:
  - name: omd-config
    behavior: merge
    literals: [APP_ENV=dev, LOG_LEVEL=debug, UVICORN_WORKERS=1]
patches:
  - target: {kind: HorizontalPodAutoscaler, name: omd-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 2}
  - target: {kind: Deployment, name: omd-web}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Gateway, name: omd-gateway}
    patch: |-
      - {op: replace, path: /spec/servers/0/hosts, value: [dev.omd.example.com]}
      - {op: replace, path: /spec/servers/1/hosts, value: [dev.omd.example.com]}
  - target: {kind: VirtualService, name: omd}
    patch: |-
      - {op: replace, path: /spec/hosts, value: [dev.omd.example.com]}
      - {op: replace, path: /spec/http/0/corsPolicy/allowOrigins/0/exact, value: "https://dev.omd.example.com"}

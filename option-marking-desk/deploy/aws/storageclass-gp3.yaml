# Default StorageClass for the Postgres PVC (EBS gp3, encrypted, zone-aware binding).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain             # keep the volume if the PVC is deleted by mistake
parameters:
  type: gp3
  encrypted: "true"

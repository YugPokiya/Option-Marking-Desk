# Let's Encrypt via Route 53 DNS-01. Credentials come from the EKS Pod Identity association
# in aws/cluster.yaml, so no access keys are stored in the cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com        # Let's Encrypt expiry notices
    privateKeySecretRef: {name: letsencrypt-prod-account}
    solvers:
      - dns01:
          route53:
            region: ap-south-1
            hostedZoneID: Z0000000000000000000   # aws route53 list-hosted-zones-by-name --dns-name omd.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omd-tls
  namespace: istio-system         # the gateway reads credentialName from its own namespace
spec:
  secretName: omd-tls
  issuerRef: {kind: ClusterIssuer, name: letsencrypt-prod}
  dnsNames: [omd.example.com]

# Accepted Trivy findings. Every entry is path-scoped and says why.
misconfigurations:
  - id: KSV-0056
    paths: ["deploy/k8s/platform/ci-deployer-rbac.yaml"]
    statement: >-
      The CI deploy role must create/update the app's Services in namespace omd. It is scoped to that
      namespace and cannot touch NetworkPolicies cluster-wide.
  - id: AWS-0053
    paths: ["terraform/alb.tf"]
    statement: The ALB serves the public web app, so it is internet-facing by design. Instances behind it are not.
  - id: AWS-0054
    paths: ["terraform/alb.tf"]
    statement: >-
      Plain-HTTP forwarding exists only while var.certificate_arn is empty (first bring-up). With a
      certificate, port 80 only redirects to HTTPS (TLS 1.2+/1.3 policy).
  - id: AWS-0104
    paths: ["terraform/security_groups.tf"]
    statement: >-
      App instances need HTTPS to ECR, S3, SSM, CodeDeploy and CloudWatch. Without a NAT gateway or VPC
      endpoints those are public AWS endpoints. Egress is limited to TCP 443 (+5432/6379 to the DB/Redis SGs).
